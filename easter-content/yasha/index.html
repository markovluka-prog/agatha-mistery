<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yasha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 40px;
      background: #0d0d0d;
      font-family: Georgia, serif;
      gap: 40px;
    }
    .title {
      font-size: clamp(1.8rem, 5vw, 4rem);
      color: #f5e9d0;
      text-align: center;
      letter-spacing: 0.04em;
    }
    #game-wrap {
      position: relative;
      width: min(600px, 96vw);
      aspect-ratio: 3/2;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }
    #score {
      font-size: 1.1rem;
      color: #aaa;
      font-family: monospace;
      letter-spacing: 0.1em;
    }
    #hint {
      font-size: 0.85rem;
      color: #555;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <p class="title">Yasha Demianov, I mog u</p>
  <div id="score">0 : 0</div>
  <div id="game-wrap">
    <canvas id="c"></canvas>
  </div>
  <div id="hint">W/S — left goalkeeper &nbsp;|&nbsp; ↑/↓ — right goalkeeper &nbsp;|&nbsp; Touch: drag your side</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const W = 600, H = 400;
    canvas.width = W; canvas.height = H;

    const GOAL_W = 12, GOAL_H = 120;
    const GK_W = 18, GK_H = 80;
    const BALL_R = 10;
    const POST_Y = (H - GOAL_H) / 2;

    let score = [0, 0];
    let ball, leftGK, rightGK;

    function reset(lastScorer) {
      ball = {
        x: W / 2, y: H / 2,
        vx: (lastScorer === 1 ? -1 : 1) * 4.5,
        vy: (Math.random() - 0.5) * 4
      };
      leftGK  = { x: GOAL_W + 20, y: H / 2 - GK_H / 2 };
      rightGK = { x: W - GOAL_W - 20 - GK_W, y: H / 2 - GK_H / 2 };
    }
    reset(0);

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup',   e => keys[e.key] = false);

    const GK_SPEED = 5;

    function moveGK(gk, up, down) {
      if (up)   gk.y -= GK_SPEED;
      if (down) gk.y += GK_SPEED;
      gk.y = Math.max(0, Math.min(H - GK_H, gk.y));
    }

    function rectCollide(bx, by, rx, ry, rw, rh) {
      return bx + BALL_R > rx && bx - BALL_R < rx + rw &&
             by + BALL_R > ry && by - BALL_R < ry + rh;
    }

    let lastTime = 0;
    function loop(ts) {
      const dt = Math.min((ts - lastTime) / 16.67, 3);
      lastTime = ts;

      moveGK(leftGK,  keys['w'] || keys['W'], keys['s'] || keys['S']);
      moveGK(rightGK, keys['ArrowUp'],         keys['ArrowDown']);

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // top/bottom walls
      if (ball.y - BALL_R < 0)    { ball.y = BALL_R;      ball.vy = Math.abs(ball.vy); }
      if (ball.y + BALL_R > H)    { ball.y = H - BALL_R;  ball.vy = -Math.abs(ball.vy); }

      // bounce off side walls (outside goal)
      if (ball.x - BALL_R < GOAL_W) {
        const inGoal = ball.y > POST_Y && ball.y < POST_Y + GOAL_H;
        if (!inGoal) { ball.x = GOAL_W + BALL_R; ball.vx = Math.abs(ball.vx); }
      }
      if (ball.x + BALL_R > W - GOAL_W) {
        const inGoal = ball.y > POST_Y && ball.y < POST_Y + GOAL_H;
        if (!inGoal) { ball.x = W - GOAL_W - BALL_R; ball.vx = -Math.abs(ball.vx); }
      }

      // goalkeeper collisions
      for (const [gk, side] of [[leftGK, 1], [rightGK, -1]]) {
        if (rectCollide(ball.x, ball.y, gk.x, gk.y, GK_W, GK_H)) {
          ball.vx = side * (Math.abs(ball.vx) + 0.3);
          ball.vy += (ball.y - (gk.y + GK_H / 2)) * 0.1;
          const maxV = 12;
          ball.vx = Math.sign(ball.vx) * Math.min(Math.abs(ball.vx), maxV);
          ball.vy = Math.sign(ball.vy) * Math.min(Math.abs(ball.vy), maxV);
        }
      }

      // goal detection
      if (ball.x - BALL_R < 0 && ball.y > POST_Y && ball.y < POST_Y + GOAL_H) {
        score[1]++; updateScore(); reset(1); requestAnimationFrame(loop); return;
      }
      if (ball.x + BALL_R > W && ball.y > POST_Y && ball.y < POST_Y + GOAL_H) {
        score[0]++; updateScore(); reset(0); requestAnimationFrame(loop); return;
      }

      draw();
      requestAnimationFrame(loop);
    }

    function updateScore() {
      scoreEl.textContent = score[0] + ' : ' + score[1];
    }

    function draw() {
      // background — field
      ctx.fillStyle = '#1a4a1a';
      ctx.fillRect(0, 0, W, H);

      // field lines
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
      ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(W/2, H/2, 4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fill();

      // goals (nets)
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(0, POST_Y, GOAL_W, GOAL_H);
      ctx.fillRect(W - GOAL_W, POST_Y, GOAL_W, GOAL_H);

      // goal posts
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      // left goal
      ctx.strokeRect(0, POST_Y, GOAL_W, GOAL_H);
      // right goal
      ctx.strokeRect(W - GOAL_W, POST_Y, GOAL_W, GOAL_H);

      // side walls (top/bottom bars connecting to posts)
      ctx.fillStyle = '#888';
      ctx.fillRect(0, 0, W, 3);
      ctx.fillRect(0, H - 3, W, 3);

      // goalkeepers — drawn as jersey-wearing figures
      drawGK(ctx, leftGK,  '#3a7bd5', '#1a3a6a');
      drawGK(ctx, rightGK, '#d53a3a', '#6a1a1a');

      // ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // ball hex pattern suggestion
      ctx.beginPath();
      ctx.arc(ball.x - 3, ball.y - 3, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
    }

    function drawGK(ctx, gk, bodyColor, darkColor) {
      const x = gk.x, y = gk.y, w = GK_W, h = GK_H;
      const cx = x + w / 2;

      // body (jersey)
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(x, y + h * 0.22, w, h * 0.55, 3);
      ctx.fill();

      // stripes
      ctx.fillStyle = darkColor;
      ctx.fillRect(cx - 2, y + h * 0.22, 4, h * 0.55);

      // head
      ctx.beginPath();
      ctx.arc(cx, y + h * 0.13, w * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = '#f0c89a';
      ctx.fill();

      // gloves
      ctx.fillStyle = '#ffe';
      ctx.beginPath(); ctx.ellipse(x - 1, y + h * 0.35, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + w + 1, y + h * 0.35, 5, 7, 0, 0, Math.PI * 2); ctx.fill();

      // legs
      ctx.fillStyle = '#222';
      ctx.fillRect(x + 2, y + h * 0.77, w * 0.35, h * 0.23);
      ctx.fillRect(x + w - 2 - w * 0.35, y + h * 0.77, w * 0.35, h * 0.23);

      // boots
      ctx.fillStyle = '#111';
      ctx.fillRect(x, y + h * 0.9, w * 0.4, h * 0.1);
      ctx.fillRect(x + w - w * 0.4, y + h * 0.9, w * 0.4, h * 0.1);
    }

    // touch controls
    let touchSide = null, touchStartY = 0, gkStartY = 0;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const tx = (t.clientX - rect.left) * (W / rect.width);
      const ty = (t.clientY - rect.top)  * (H / rect.height);
      touchSide   = tx < W / 2 ? 'left' : 'right';
      touchStartY = ty;
      gkStartY    = touchSide === 'left' ? leftGK.y : rightGK.y;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const ty = (t.clientY - rect.top) * (H / rect.height);
      const dy = ty - touchStartY;
      if (touchSide === 'left')  leftGK.y  = Math.max(0, Math.min(H - GK_H, gkStartY + dy));
      if (touchSide === 'right') rightGK.y = Math.max(0, Math.min(H - GK_H, gkStartY + dy));
    }, { passive: false });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
